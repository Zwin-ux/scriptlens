name: fast-checks

on:
  push:
  pull_request:

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-script-detector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-script-detector/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic fast-check suite
        run: npm run ci:fast

      - name: Build extension
        run: npm run build:extension

      - name: Package extension
        run: npm run package:extension

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scriptlens-fast-check-artifacts
          path: |
            ai-script-detector/dist/chrome-unpacked
            ai-script-detector/dist/packages
