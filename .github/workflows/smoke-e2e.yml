name: smoke-e2e

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-script-detector
    env:
      SCRIPTLENS_PUBLIC_SITE_ORIGIN: ${{ vars.SCRIPTLENS_PUBLIC_SITE_ORIGIN || 'https://synergyaiscript.up.railway.app' }}
      PW_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-script-detector/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build staged extension
        run: npm run build:extension

      - name: Run YouTube smoke suite
        run: npx playwright test tests/youtube.smoke.spec.js --reporter=line

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scriptlens-smoke-e2e-artifacts
          path: |
            ai-script-detector/dist/chrome-unpacked
            ai-script-detector/test-results

